<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game</title>
</head>
<body>

  <h2>Rock Paper Scissors</h2>

  <button onclick="
    let computer = '';
    const randomNumber = Math.random();

    if (randomNumber < 1/3) {
      computer = 'rock';
    } else if (randomNumber < 2/3) {
      computer = 'paper';
    } else {
      computer = 'scissors';
    }

    let result = '';

    if (computer === 'rock') {
      result = 'Tie';
    } else if (computer === 'paper') {
      result = 'You lose';
    } else {
      result = 'You win';
    }

    alert(`You picked rock. Computer picked ${computer}. ${result}`);
  ">Rock</button>

  <button onclick="
    let computer = '';
    const randomNumber = Math.random();

    if (randomNumber < 1/3) {
      computer = 'rock';
    } else if (randomNumber < 2/3) {
      computer = 'paper';
    } else {
      computer = 'scissors';
    }

    let result = '';

    if (computer === 'rock') {
      result = 'You win';
    } else if (computer === 'paper') {
      result = 'Tie';
    } else {
      result = 'You lose';
    }

    alert(`You picked paper. Computer picked ${computer}. ${result}`);
  ">Paper</button>

  <button onclick="
    let computer = '';
    const randomNumber = Math.random();

    if (randomNumber < 1/3) {
      computer = 'rock';
    } else if (randomNumber < 2/3) {
      computer = 'paper';
    } else {
      computer = 'scissors';
    }

    let result = '';

    if (computer === 'rock') {
      result = 'You lose';
    } else if (computer === 'paper') {
      result = 'You win';
    } else {
      result = 'Tie';
    }

    alert(`You picked scissors. Computer picked ${computer}. ${result}`);
  ">Scissors</button>

</body>
</html>
