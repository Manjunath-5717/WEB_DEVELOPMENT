<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox practice</title>
</head>
<body>
  <div style=" display:flex;
  flex-direction: row;

  ">
    <div style="background-color: lightblue;">div 1</div>
    <div style="background-color: pink;">div 2<p>text</p></div>
  </div>

  <div style=" display:flex;
  flex-direction: row;
  margin-top: 30px;

  ">
    <div style="background-color: lightblue;width: 100px;">div 1</div>
    <div style="background-color: pink;
    flex:1; ">div 2</div>
  </div>

  <div style=" display:flex;
  flex-direction: row;
  margin-top: 30px;
   justify-content: center;
    height:20px;
    width:20px;
    border-color:gray;
    border-style: solid;
    border-width: 2px;

  ">
    <div style="background-color: lightblue;width: 100px;">div 1</div>
    <div style="background-color: pink;
    flex:1; ">div 2</div>
     <div style="background-color: lightblue;flex:1;">div 1</div>
  </div>
</body>
</html>
