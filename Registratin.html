<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registartin Forms</title>
</head>
<body>
  <legend>
  <h1>Registration Forms</h1>

  <form>
    <label for="fullname">Full Nmae:</label>
    <input type="text" id="fullname" placeholder="enter your full name">
    <br><br>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="Enter your Emailid">

    <br> <br>

    <label for="password">password</label>
    <input type="password" id="passwword" name="password" placeholder="Enter ur password">
    <br><br>

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter ur phone number">
    <br><br>

    <label for="dob">Date of Birth</label>
    <input type="date" name="dob" id="dob">

    <br><br>
    <label for="gender">Gender:</label>

    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="other">other</label>

    <input type="radio" id="other" name="gender" value="oter">

    <br><br>
         
        <label>Skills:</label>

        <input type="checkbox" id="html" name="skills" value="html">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="css">
        <label for="css">CSS</label>

        <input type="checkbox" id="javascript" name="skills" value="javascript">
        <label for="javascript">JavaScript</label>
<br><br>
        
 <label for="country">Country:</label>

        <select id="country" name="country">
            <option value="">Select Country</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select>

        <br><br>

        <label for="file">File:</label>
        <input type="file" id="id" name="file">
        </legend>
  </form>
  
</body>
</html>
