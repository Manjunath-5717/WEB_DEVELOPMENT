<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Property</title>
</head>
<body>
    <div style="
    display:grid;
    grid-template-columns: 100px 100px;
   
    ">
      <div style="background-color: aqua;">div 1</div>
      <div style="background-color: wheat;">div2 <p>text</p></div>

      <div style="
      margin-top:30px;
    display:grid;
    grid-template-columns: 100px 100px 200px;
    ">
      <div style="background-color: aqua;">div 1</div>
      <div style="background-color: wheat;">div2<p>text</p></div>
       

       <div style="
      margin-top:30px;
    display:grid;
    grid-template-columns: 100px 1fr;
    ">
      <div style="background-color: aqua;">div 1</div>
      <div style="background-color: wheat;">div2<p>text</p></div>
       

       
  </div>
</body>
</html>
