<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amazon-Shipping </title>
  <style>
     .cost_input{
    font-size:15px;
    /*
     padding-top:10px;
    padding-bottom:10px;
    padding-left:10px;
    padding-left:10px;
    */
    padding:10px;
    

  }
  .calculate-button{
    background-color: green;
    color:white;
    padding:10px,250px;
    border:none;
    font-size:15px;
    cursor:pointer;



  }
    
  </style>
 
</head>
<body>
  <p>Amazon Shipping Calculation </p>
  <input placeholder="cost of Order" class="js-cost-input cost-input">
  <button onclick="
  calculateToatl();
   " class="calculate-button">Calculate</button> 
  <p class="js-toatl"></p>
  <script>
 function calculateToatl(){
 const inputElement =document.querySelector('.js-cost-input');
 let cost=Number(inputElement.value);
 if(cost<40){
  cost=cost + 10;
 }
 document.querySelector('.js-toatl').innerHTML=`$${cost}`;
 }
  </script>
  
</body>
</html>
